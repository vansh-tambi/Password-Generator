<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ Quantum Password Generator</title>
    <link rel="icon" type="image/x-icon" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="main.css" />
</head>
<body>
    <div id="wrapper">
      <div class="glass-card">
        <h1 class="heading glitch" data-text="Quantum Pass Gen">
          Quantum Pass Gen
        </h1>
        <p class="sub-heading">Generate ultra-secure passwords for the digital age.</p>

        <div class="display-container">
          <input
            type="text"
            placeholder="P4$5W0RD"
            readonly
            class="password-display"
            data-password-display
          />
          <button class="copy-btn" data-copy-btn aria-label="Copy password">
            <span class="tooltip" data-copy-message></span>
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>

        <div class="input-container">
          <div class="length-container">
            <p class="label">
              <i class="fa-solid fa-ruler-horizontal icon"></i> Password Length
            </p>
            <p class="length-display" data-length-display>10</p>
          </div>

          <input
            type="range"
            min="1"
            max="20"
            step="1"
            value="10"
            class="slider"
            data-length-slider
          />

          <div class="options-grid">
            <div class="option">
              <input type="checkbox" id="uppercase" class="checkbox" />
              <label for="uppercase">Include Uppercase (A-Z)</label>
            </div>
            <div class="option">
              <input type="checkbox" id="lowercase" class="checkbox" />
              <label for="lowercase">Include Lowercase (a-z)</label>
            </div>
            <div class="option">
              <input type="checkbox" id="numbers" class="checkbox" />
              <label for="numbers">Include Numbers (0-9)</label>
            </div>
            <div class="option">
              <input type="checkbox" id="symbols" class="checkbox" />
              <label for="symbols">Include Symbols (@#$%)</label>
            </div>
          </div>

          <div class="strength-container">
            <p class="label">
              <i class="fa-solid fa-shield-halved icon"></i> Strength
            </p>
            <div class="indicator" data-strength-indicator></div>
          </div>

          <button class="generate-btn" data-generate-btn>
            <i class="fa-solid fa-bolt-lightning"></i> Generate Password
          </button>
        </div>
      </div>
    </div>
    <script src="java.js"></script>
</body>
</html>
